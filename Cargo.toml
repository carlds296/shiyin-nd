[package]
name = "shiyin-nd"
version = "0.3.0"
edition = "2021"
description = "Headless Kugou protocol engine + NAS downloader (no Flutter, no FRB, no backend)"
license = "MIT"

[lib]
name = "shiyin_nd"
path = "src/lib.rs"

[[bin]]
name = "shiyin-nd"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync", "time", "signal"] }
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls", "charset", "http2", "json", "gzip",
] }
anyhow = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "tls12", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
md-5 = { version = "0.11", default-features = false, features = ["alloc"] }
digest = { version = "0.11", default-features = false, features = ["alloc"] }
hex = "0.4"
flate2 = "1"
base64 = "0.22"
rand = "0.10"
aes = "0.9"
cipher = { version = "0.5", features = ["block-padding"] }
rsa = { version = "0.9", features = ["sha2"] }
num-bigint = "0.4"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
tracing = "0.1"
url = "2"
png = "0.17"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
